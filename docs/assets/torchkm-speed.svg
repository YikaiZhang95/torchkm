<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" font-family="Helvetica Neue, Arial, system-ui, sans-serif">
  <rect width="860" height="430" fill="#ffffff"/>
  <!-- Title -->
  <text x="40" y="46" font-size="22" font-weight="700" fill="#0f172a">Full train + tune, returned in seconds</text>
  <text x="40" y="72" font-size="14" fill="#64748b">Kernel SVM, end-to-end 10-fold CV over a 50-point &#955; grid &#183; n = 10,000, p = 1,000 &#183; one GPU</text>

  <!-- log axis gridlines: 1s 10s 100s 1k 10k 100k  (x = 150 + log10(v)/5*640) -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="150" y1="110" x2="150" y2="330"/>
    <line x1="278" y1="110" x2="278" y2="330"/>
    <line x1="406" y1="110" x2="406" y2="330"/>
    <line x1="534" y1="110" x2="534" y2="330"/>
    <line x1="662" y1="110" x2="662" y2="330"/>
    <line x1="790" y1="110" x2="790" y2="330"/>
  </g>
  <g font-size="11" fill="#94a3b8" text-anchor="middle">
    <text x="150" y="350">1s</text>
    <text x="278" y="350">10s</text>
    <text x="406" y="350">100s</text>
    <text x="534" y="350">1,000s</text>
    <text x="662" y="350">10,000s</text>
    <text x="790" y="350">100,000s</text>
  </g>
  <text x="470" y="378" font-size="11" fill="#94a3b8" text-anchor="middle" font-style="italic">wall-clock time, log scale (lower is better)</text>

  <!-- Bars: bar starts at x=150, width = log10(v)/5*640 -->
  <!-- scikit-learn 14322.8s -> log10=4.156 -> w=532 -->
  <g>
    <rect x="150" y="120" width="532" height="44" rx="4" fill="#f59e0b"/>
    <text x="40" y="147" font-size="14" font-weight="600" fill="#0f172a">scikit-learn</text>
    <text x="694" y="147" font-size="14" font-weight="700" fill="#b45309">14,322.8 s  (~4 hours)</text>
  </g>
  <!-- ThunderSVM 279.4s -> log10=2.446 -> w=313 -->
  <g>
    <rect x="150" y="188" width="313" height="44" rx="4" fill="#3b82f6"/>
    <text x="40" y="215" font-size="14" font-weight="600" fill="#0f172a">ThunderSVM</text>
    <text x="475" y="215" font-size="14" font-weight="700" fill="#1d4ed8">279.4 s</text>
  </g>
  <!-- TorchKM 37.7s -> log10=1.576 -> w=202 -->
  <g>
    <rect x="150" y="256" width="202" height="44" rx="4" fill="#16a34a"/>
    <text x="40" y="283" font-size="14" font-weight="700" fill="#0f172a">TorchKM</text>
    <text x="364" y="283" font-size="14" font-weight="700" fill="#15803d">37.7 s  &#10003; best objective</text>
  </g>

  <!-- callout -->
  <rect x="40" y="396" width="780" height="2" fill="#f1f5f9"/>
  <text x="40" y="420" font-size="13" fill="#334155"><tspan font-weight="700" fill="#15803d">380&#215; faster than scikit-learn</tspan>, 7&#215; faster than ThunderSVM &#8212; and TorchKM returns the lower-objective (provably better) solution, not an approximation. Source: paper Table 2.</text>
</svg>
